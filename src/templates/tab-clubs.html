  <!-- ── CLUBS TAB ── -->
      <div v-if="activeTab==='clubs'" class="content" style="padding:14px;display:flex;flex-direction:column;gap:14px">

    <!-- Loading -->
    <div v-if="espionageLoading" class="card" style="text-align:center;padding:40px">
      <div style="font-size:30px;margin-bottom:10px">🏟</div>
      <div class="c-gray" style="margin-bottom:12px">{{espionageMsg||'Loading all clubs…'}}</div>
      <div style="width:260px;margin:0 auto">
        <div style="background:#21262d;border-radius:4px;height:6px;overflow:hidden">
          <div :style="{width:espionageProgress+'%',height:'100%',background:'linear-gradient(90deg,#1f6feb,#8957e5)',borderRadius:'4px',transition:'width .3s'}"></div>
        </div>
      </div>
      <div class="c-gray" style="font-size:11px;margin-top:8px">{{espionageProgress}}% · first load ~30 seconds · cached 30 min</div>
    </div>
    <div v-else-if="!espionageLoaded" class="card" style="text-align:center;padding:40px">
      <div style="font-size:30px;margin-bottom:10px">🏟</div>
      <div class="c-gray">Loading clubs data…</div>
    </div>

    <!-- Loaded -->
    <template v-if="espionageLoaded">

      <!-- Club detail overlay -->
      <div v-if="selectedClubName" style="display:flex;flex-direction:column;gap:12px">
        <!-- Header card -->
        <div class="card" style="padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10">
          <button class="btn" @click="selectedClubName=null" style="font-size:12px">← Back</button>
          <button class="btn" @click="openClubDetail(selectedClubName)" style="font-size:12px" title="Reload latest submission">↺ Reload</button>
          <button class="btn" @click="showRawSub=!showRawSub" style="font-size:12px" :style="{color:showRawSub?'#ffa657':''}">{ } Raw</button>
          <div style="flex:1;min-width:120px">
            <div style="font-size:20px;font-weight:800;color:#e6edf3;letter-spacing:-.3px">
              {{selectedClubName}}
              <span v-if="selectedClubName===myClub" style="color:#ffa657;font-size:13px;font-weight:600;margin-left:6px">★ My Club</span>
            </div>
            <div style="margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
              <template v-if="selectedClubSubmissions.length">
                <span style="color:#79c0ff;font-size:14px;font-weight:700">{{fmtFormation(selectedClubSubmissions[0].formation)}}</span>
                <span v-if="selectedClubSubmissions[0].gameweek" class="c-gray" style="font-size:11px">GW{{selectedClubSubmissions[0].gameweek}}</span>
                <span v-else-if="selectedClubSubmissions[0].submittedAt" class="c-gray" style="font-size:11px">{{new Date(selectedClubSubmissions[0].submittedAt).toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}}</span>
                <template v-for="(val,key) in selectedClubSubmissions[0].instructions||{}" :key="key">
                  <span v-if="key!=='training_focus'" style="background:#21262d;border-radius:10px;padding:2px 8px;font-size:10px">
                    <span style="color:#6e7681">{{({mentality:'Mentality',style:'Style',structure:'Structure',defensive_line:'Def. Line',pressing_intensity:'Press',attacking_focus:'Attack',transition_speed:'Trans.'})[key]||key}}</span>
                    <span style="color:#e6edf3;margin-left:4px">{{val}}</span>
                  </span>
                </template>
                <template v-if="selectedClubSubmissions[0].setPieces">
                  <span v-if="selectedClubSubmissions[0].setPieces.attackingCorner?.delivery"
                        :title="setPieceDesc('delivery', selectedClubSubmissions[0].setPieces.attackingCorner.delivery)"
                        style="background:#1e1535;border:1px solid #3d2a6e;border-radius:10px;padding:2px 8px;font-size:10px;cursor:default">
                    <span style="color:#8b6cc8">⚑ Atk</span>
                    <span style="color:#d2a8ff;margin-left:4px">{{selectedClubSubmissions[0].setPieces.attackingCorner.delivery}}</span>
                  </span>
                  <span v-if="selectedClubSubmissions[0].setPieces.defensiveCorner?.scheme"
                        :title="setPieceDesc('scheme', selectedClubSubmissions[0].setPieces.defensiveCorner.scheme)"
                        style="background:#1e1535;border:1px solid #3d2a6e;border-radius:10px;padding:2px 8px;font-size:10px;cursor:default">
                    <span style="color:#8b6cc8">⛨ Def</span>
                    <span style="color:#d2a8ff;margin-left:4px">{{selectedClubSubmissions[0].setPieces.defensiveCorner.scheme}}</span>
                    <span v-if="selectedClubSubmissions[0].setPieces.defensiveCorner.press" style="color:#6e7681;margin-left:3px">· {{selectedClubSubmissions[0].setPieces.defensiveCorner.press}}</span>
                  </span>
                </template>
              </template>
              <span v-if="clubBudgetFor(selectedClubName)!=null"
                    style="background:#0d2a13;border:1px solid #1a4a2a;border-radius:10px;padding:2px 10px;font-size:11px;font-weight:700;color:#3fb950;white-space:nowrap">
                💰 £{{(clubBudgetFor(selectedClubName)/1e6).toFixed(1)}}m
              </span>
              <span v-if="clubChemScore(selectedClubName)!=null"
                    :style="{background:'#111',border:'1px solid '+chemColor(clubChemScore(selectedClubName))+'44',borderRadius:'10px',padding:'2px 10px',fontSize:'11px',fontWeight:'700',color:chemColor(clubChemScore(selectedClubName)),whiteSpace:'nowrap'}"
                    title="Team chemistry (0–100 based on squad stability)">
                🤝 {{clubChemScore(selectedClubName)}}
              </span>
            </div>
          </div>
        </div>

        <!-- Sub-tabs -->
        <div style="display:flex;gap:0;border-bottom:1px solid #21262d">
          <button v-for="t in [{id:'xi',label:'Latest XI'},{id:'academy',label:'Academy'},{id:'history',label:'History'},{id:'transfers',label:'Transfers'}]" :key="t.id"
            @click="selectedClubSubTab=t.id; t.id==='academy' && _fetchClubInfo(selectedClubName)"
            style="background:none;border:none;border-bottom:2px solid transparent;padding:8px 16px;cursor:pointer;font-size:12px;font-weight:500;margin-bottom:-1px"
            :style="selectedClubSubTab===t.id?{borderBottomColor:'#79c0ff',color:'#e6edf3',fontWeight:'700'}:{color:'#8b949e'}">
            {{t.label}}
          </button>
        </div>

        <!-- Latest XI tab -->
        <div v-if="selectedClubSubTab==='xi'" style="display:flex;flex-direction:column;gap:12px">
          <template v-if="selectedClubSubmissions.length">
            <!-- Wide-screen 2-col: pitch+setpieces+subs left, squad right -->
            <div class="club-xi-layout">
            <!-- Pitch: auto-width column (direct grid child) -->
              
              <!-- Big interactive pitch -->
              <div style="width:min(320px,100%);position:relative">
                <svg viewBox="-3 -3 74 111" style="width:100%;max-height:78vh;border-radius:8px;border:1px solid #2d3748;display:block" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <marker id="arr" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
                      <path d="M0,0 L5,2.5 L0,5 Z" fill="rgba(255,255,255,0.85)"/>
                    </marker>
                    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stop-color="#1a4726"/>
                      <stop offset="50%" stop-color="#1f5730"/>
                      <stop offset="100%" stop-color="#1a4726"/>
                    </linearGradient>
                  </defs>
                  <rect x="-3" y="-3" width="74" height="111" fill="url(#grass)"/>
                  <rect x="0" y="0" width="68" height="105" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.7"/>
                  <line x1="0" y1="52.5" x2="68" y2="52.5" stroke="rgba(255,255,255,0.3)" stroke-width="0.6"/>
                  <circle cx="34" cy="52.5" r="9.15" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.6"/>
                  <circle cx="34" cy="52.5" r="0.7" fill="rgba(255,255,255,0.5)"/>
                  <rect x="13.84" y="0" width="40.32" height="16.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.6"/>
                  <rect x="13.84" y="88.5" width="40.32" height="16.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.6"/>
                  <rect x="24.84" y="0" width="18.32" height="5.5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
                  <rect x="24.84" y="99.5" width="18.32" height="5.5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
                  <circle cx="34" cy="11" r="0.7" fill="rgba(255,255,255,0.5)"/>
                  <circle cx="34" cy="94" r="0.7" fill="rgba(255,255,255,0.5)"/>

                  <!-- Run arrows (behind players) -->
                  <template v-for="(pl,i) in pitchLayout(selectedClubSubmissions[0])" :key="'run'+i">
                    <line v-if="pl.runX!==null"
                      :x1="pl.x" :y1="pl.y" :x2="pl.runX" :y2="pl.runY"
                      stroke="rgba(255,255,255,0.55)" stroke-width="0.9" stroke-dasharray="2.5,1.5"
                      marker-end="url(#arr)"/>
                  </template>

                  <!-- Interactive player nodes -->
                  <template v-for="(pl,i) in pitchLayout(selectedClubSubmissions[0])" :key="'pl'+i">
                    <g @mouseenter="hoveredPitchPlayer=pl" @mouseleave="hoveredPitchPlayer=null"
                       @click="xiPlayerInfo(pl.name)&&openModal(xiPlayerInfo(pl.name))"
                       style="cursor:pointer">
                      <circle :cx="pl.x" :cy="pl.y" r="3.0" :fill="pl.stroke" opacity="0.1"/>
                      <circle :cx="pl.x" :cy="pl.y" r="2.5" :fill="pl.fill" :stroke="pl.stroke" stroke-width="0.5"/>
                      <text :x="pl.x" :y="pl.y+0.9" text-anchor="middle" font-size="2.2" fill="white" font-weight="800" font-family="system-ui,sans-serif">{{pl.bp}}</text>
                      <text :x="pl.x" :y="pl.y-4" text-anchor="middle" font-size="2.1" fill="rgba(255,255,255,0.9)" font-weight="700" font-family="system-ui,sans-serif">{{xiPlayerInfo(pl.name) ? (xiPlayerInfo(pl.name)._gameRating||xiPlayerInfo(pl.name).Rating||'') : ''}}</text>
                      <text :x="pl.x" :y="pl.y+5.8" text-anchor="middle" font-size="2.0" :fill="pl.textColor" font-weight="600" font-family="system-ui,sans-serif">{{pl.name.split(' ').pop().slice(0,11)}}</text>
                      <text :x="pl.x" :y="pl.y+8.5" text-anchor="middle" font-size="1.85" :fill="fitColor(playerFitPct(pl.name))" font-weight="700" font-family="system-ui,sans-serif" :opacity="playerFitPct(pl.name)!=null?1:0">{{playerFitPct(pl.name)!=null?playerFitPct(pl.name)+'%':''}}</text>
                    </g>
                  </template>
                </svg>

                <!-- Hover tooltip -->
                <div v-if="hoveredPitchPlayer && xiPlayerInfo(hoveredPitchPlayer.name)"
                  :style="{
                    position:'absolute',
                    left: (hoveredPitchPlayer.x+3)/74 < 0.55 ? (((hoveredPitchPlayer.x+3)/74*100+8)+'%') : 'auto',
                    right: (hoveredPitchPlayer.x+3)/74 >= 0.55 ? (((1-(hoveredPitchPlayer.x+3)/74)*100+8)+'%') : 'auto',
                    top: Math.max(2, (hoveredPitchPlayer.y+3)/111*100-20)+'%',
                    zIndex: '20',
                    pointerEvents: 'none',
                    background: 'rgba(13,17,23,0.97)',
                    border: '1px solid #30363d',
                    borderRadius: '8px',
                    padding: '10px 12px',
                    minWidth: '175px',
                    maxWidth: '215px',
                    fontSize: '11px',
                    boxShadow: '0 4px 16px rgba(0,0,0,0.6)'
                  }">
                  <div style="font-weight:700;color:#e6edf3;font-size:13px;margin-bottom:3px">{{xiPlayerInfo(hoveredPitchPlayer.name).Player}}</div>
                  <div style="display:flex;gap:8px;align-items:center;margin-bottom:7px">
                    <span :class="'pos-badge pos-'+hoveredPitchPlayer.bp" style="font-size:9px">{{hoveredPitchPlayer.position}}</span>
                    <span style="color:#ffa657;font-weight:700;font-size:14px">{{xiPlayerInfo(hoveredPitchPlayer.name)._gameRating||xiPlayerInfo(hoveredPitchPlayer.name).Rating}}</span>
                    <span style="color:#6e7681;font-size:11px">Age {{xiPlayerInfo(hoveredPitchPlayer.name).Age}}</span>
                  </div>
                  <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 14px">
                    <template v-for="attr in ['Speed','Passing','Marking','Heading','Tackling','Stamina','Dribbling','Shooting','Handling','Reflexes','Strength','Vision']" :key="attr">
                      <div style="display:flex;justify-content:space-between;align-items:center">
                        <span :style="{color: attr===({GK:'Reflexes',FB:'Speed',CB:'Marking',DM:'Tackling',CM:'Passing',WM:'Dribbling',AM:'Vision',WF:'Dribbling',CF:'Shooting'})[hoveredPitchPlayer.bp] ? '#ffa657' : '#6e7681', fontSize:'10px'}">{{attr.slice(0,3)}}</span>
                        <span style="color:#e6edf3;font-weight:600;font-size:11px">{{xiPlayerInfo(hoveredPitchPlayer.name)[attr]||'—'}}</span>
                      </div>
                    </template>
                  </div>
                  <template v-if="playerFitPct(hoveredPitchPlayer.name)!=null||xiPlayerInfo(hoveredPitchPlayer.name).Form||xiPlayerInfo(hoveredPitchPlayer.name).Morale">
                    <div style="margin-top:7px;border-top:1px solid #21262d;padding-top:6px;display:flex;gap:12px;align-items:center">
                      <span v-if="playerFitPct(hoveredPitchPlayer.name)!=null" style="color:#8b949e;font-size:10px">Fit <span :style="{color:fitColor(playerFitPct(hoveredPitchPlayer.name)),fontWeight:'700',fontSize:'12px'}">{{playerFitPct(hoveredPitchPlayer.name)}}%</span></span>
                      <span v-if="xiPlayerInfo(hoveredPitchPlayer.name).Form" style="color:#8b949e;font-size:10px">Form <span style="color:#79c0ff;font-weight:700">{{xiPlayerInfo(hoveredPitchPlayer.name).Form}}</span></span>
                      <span v-if="xiPlayerInfo(hoveredPitchPlayer.name).Morale" style="color:#8b949e;font-size:10px">Mor <span style="color:#d2a8ff;font-weight:700">{{xiPlayerInfo(hoveredPitchPlayer.name).Morale}}</span></span>
                    </div>
                  </template>
                </div>
              </div>

            <!-- Squad + Panels: 1fr column, flex row internally -->
            <div class="club-squad-panels-row">

              <!-- Set Pieces · Subs · Roles panel -->
              <div v-if="selectedClubSubmissions[0].setPieces || selectedClubSubmissions[0].subs?.length || selectedClubSubmissions[0].roles"
                   class="club-setpieces-panel" style="display:flex;flex-direction:column;gap:8px">
                  
              <!-- Set Pieces (above subs) -->
              <div v-if="selectedClubSubmissions[0].setPieces" style="display:flex;flex-direction:column;gap:8px">
                <div class="card" style="padding:10px">
                  <div style="font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:10px">Set Pieces</div>

                  <!-- ── Attacking Corner ── -->
                  <div style="font-size:9px;color:#d2a8ff;text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:6px">⚑ Attacking Corner</div>
                  <template v-if="selectedClubSubmissions[0].setPieces.attackingCorner">

                    <!-- Taker (from roles.corner) — same row layout as zone rows -->
                    <div v-if="selectedClubSubmissions[0].roles?.corner"
                         style="display:flex;align-items:center;gap:4px;padding:3px 0;border-bottom:1px solid #21262d">
                      <span style="flex:0 0 64px;color:#6e7681;font-size:10px;white-space:nowrap">Taker</span>
                      <span @click.stop="xiPlayerInfo(selectedClubSubmissions[0].roles.corner)&&openModal(xiPlayerInfo(selectedClubSubmissions[0].roles.corner))"
                            style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#ffa657;font-size:10px;cursor:pointer;border-bottom:1px dotted rgba(255,166,87,0.4)">
                        {{selectedClubSubmissions[0].roles.corner||'—'}}
                      </span>
                      <template v-for="attr in ['Passing','Vision']" :key="'tk-'+attr">
                        <span style="flex:0 0 30px;text-align:right;font-size:9px;color:#6e7681;white-space:nowrap">
                          {{attr.slice(0,3)}} <span :style="{fontWeight:'700',color:spAttrColor(xiPlayerInfo(selectedClubSubmissions[0].roles.corner)?.[attr])}">{{xiPlayerInfo(selectedClubSubmissions[0].roles.corner)?.[attr]||'—'}}</span>
                        </span>
                      </template>
                    </div>

                    <!-- Delivery + description -->
                    <div v-if="selectedClubSubmissions[0].setPieces.attackingCorner.delivery" style="padding:4px 0;border-bottom:1px solid #21262d">
                      <div style="display:flex;justify-content:space-between;align-items:baseline">
                        <span style="color:#6e7681;font-size:10px">Delivery</span>
                        <span style="color:#e6edf3;font-size:11px;font-weight:600">{{selectedClubSubmissions[0].setPieces.attackingCorner.delivery}}</span>
                      </div>
                      <div v-if="setPieceDesc('delivery',selectedClubSubmissions[0].setPieces.attackingCorner.delivery)" style="color:#8b949e;font-size:9px;font-style:italic;margin-top:1px">
                        {{setPieceDesc('delivery',selectedClubSubmissions[0].setPieces.attackingCorner.delivery)}}
                      </div>
                    </div>

                    <!-- Stay Back -->
                    <div v-if="selectedClubSubmissions[0].setPieces.attackingCorner.stayBack!=null" style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #21262d">
                      <span style="color:#6e7681;font-size:10px">Stay Back</span>
                      <span style="color:#e6edf3;font-size:11px">
                        {{selectedClubSubmissions[0].setPieces.attackingCorner.stayBack==0?'None':selectedClubSubmissions[0].setPieces.attackingCorner.stayBack+' player'+(selectedClubSubmissions[0].setPieces.attackingCorner.stayBack==1?'':'s')}}
                      </span>
                    </div>

                    <!-- Attacking zone assignments — attrs always visible on same row -->
                    <template v-if="Object.keys(selectedClubSubmissions[0].setPieces.attackingCorner.zones||{}).length">
                      <div style="margin-top:4px">
                        <div v-for="(player, zoneKey) in selectedClubSubmissions[0].setPieces.attackingCorner.zones" :key="'az-'+zoneKey"
                             style="display:flex;align-items:center;gap:4px;padding:3px 4px;border-radius:4px;margin-bottom:1px"
                             :style="{
                               background: spDeliveryHighlight(selectedClubSubmissions[0].setPieces.attackingCorner.delivery, zoneKey) ? 'rgba(63,185,80,0.07)' : 'transparent',
                               outline: spDeliveryHighlight(selectedClubSubmissions[0].setPieces.attackingCorner.delivery, zoneKey) ? '1px solid rgba(63,185,80,0.25)' : 'none',
                             }">
                          <span style="flex:0 0 64px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"
                                :title="setPieceDesc('atkZone',zoneKey)"
                                :style="{color:spDeliveryHighlight(selectedClubSubmissions[0].setPieces.attackingCorner.delivery,zoneKey)?'#3fb950':'#6e7681'}">
                            {{spDeliveryHighlight(selectedClubSubmissions[0].setPieces.attackingCorner.delivery,zoneKey)?'▶ ':''}}{{setPieceZoneLabel('atk',zoneKey)}}
                          </span>
                          <span @click.stop="xiPlayerInfo(player)&&openModal(xiPlayerInfo(player))"
                                style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;cursor:pointer;border-bottom:1px dotted"
                                :style="{color:spDeliveryHighlight(selectedClubSubmissions[0].setPieces.attackingCorner.delivery,zoneKey)?'#7ee787':'#79c0ff',borderColor:spDeliveryHighlight(selectedClubSubmissions[0].setPieces.attackingCorner.delivery,zoneKey)?'rgba(126,231,135,0.35)':'rgba(121,192,255,0.35)'}">
                            {{player}}
                          </span>
                          <template v-for="attr in spZoneAttrs('atk',zoneKey)" :key="'as-'+zoneKey+attr">
                            <span style="flex:0 0 30px;text-align:right;font-size:9px;color:#6e7681;white-space:nowrap">
                              {{attr.slice(0,3)}} <span :style="{fontWeight:'700',color:spAttrColor(xiPlayerInfo(player)?.[attr])}">{{xiPlayerInfo(player)?.[attr]||'—'}}</span>
                            </span>
                          </template>
                        </div>
                      </div>
                    </template>
                  </template>

                  <!-- ── Defensive Corner ── -->
                  <div style="font-size:9px;color:#79c0ff;text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-top:12px;margin-bottom:6px">⛨ Defensive Corner</div>
                  <template v-if="selectedClubSubmissions[0].setPieces.defensiveCorner">

                    <!-- Scheme + description -->
                    <div v-if="selectedClubSubmissions[0].setPieces.defensiveCorner.scheme" style="padding:4px 0;border-bottom:1px solid #21262d">
                      <div style="display:flex;justify-content:space-between;align-items:baseline">
                        <span style="color:#6e7681;font-size:10px">Scheme</span>
                        <span style="color:#e6edf3;font-size:11px;font-weight:600">{{selectedClubSubmissions[0].setPieces.defensiveCorner.scheme}}</span>
                      </div>
                      <div v-if="setPieceDesc('scheme',selectedClubSubmissions[0].setPieces.defensiveCorner.scheme)" style="color:#8b949e;font-size:9px;font-style:italic;margin-top:1px">
                        {{setPieceDesc('scheme',selectedClubSubmissions[0].setPieces.defensiveCorner.scheme)}}
                      </div>
                    </div>

                    <!-- Press + description -->
                    <div v-if="selectedClubSubmissions[0].setPieces.defensiveCorner.press" style="padding:4px 0;border-bottom:1px solid #21262d">
                      <div style="display:flex;justify-content:space-between;align-items:baseline">
                        <span style="color:#6e7681;font-size:10px">Press</span>
                        <span style="color:#e6edf3;font-size:11px;font-weight:600">{{selectedClubSubmissions[0].setPieces.defensiveCorner.press}}</span>
                      </div>
                      <div v-if="setPieceDesc('press',selectedClubSubmissions[0].setPieces.defensiveCorner.press)" style="color:#8b949e;font-size:9px;font-style:italic;margin-top:1px">
                        {{setPieceDesc('press',selectedClubSubmissions[0].setPieces.defensiveCorner.press)}}
                      </div>
                    </div>

                    <!-- Defensive zone assignments — attrs always visible on same row -->
                    <template v-if="Object.keys(selectedClubSubmissions[0].setPieces.defensiveCorner.zones||{}).length">
                      <div style="margin-top:4px">
                        <div v-for="(player, zoneKey) in selectedClubSubmissions[0].setPieces.defensiveCorner.zones" :key="'dz-'+zoneKey"
                             style="display:flex;align-items:center;gap:4px;padding:3px 4px;border-radius:4px;margin-bottom:1px">
                          <span style="flex:0 0 64px;color:#6e7681;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"
                                :title="setPieceDesc('defZone',zoneKey)">
                            {{setPieceZoneLabel('def',zoneKey)}}
                          </span>
                          <span @click.stop="xiPlayerInfo(player)&&openModal(xiPlayerInfo(player))"
                                style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#79c0ff;font-size:10px;cursor:pointer;border-bottom:1px dotted rgba(121,192,255,0.35)">
                            {{player}}
                          </span>
                          <template v-for="attr in spZoneAttrs('def',zoneKey)" :key="'ds-'+zoneKey+attr">
                            <span style="flex:0 0 30px;text-align:right;font-size:9px;color:#6e7681;white-space:nowrap">

            <!-- Facilities -->
            <div style="border-top:1px solid #21262d;padding-top:7px;display:flex;gap:10px;flex-wrap:wrap">
              <div v-for="[fk, fl] in [['training','Trn'],['scouting','Sct'],['academy','Aca'],['medical','Med'],['analytics','Ana'],['stadium','Std']]" :key="fk"
                   style="display:flex;flex-direction:column;align-items:center;gap:3px">
                <span style="font-size:9px;color:#6e7681;font-weight:700;text-transform:uppercase">{{fl}}</span>
                <div style="display:flex;gap:2px">
                  <span v-for="i in 5" :key="i"
                        :style="{width:'7px',height:'7px',borderRadius:'50%',display:'inline-block',
                          background: i<=(c.levels?.[fk]||0)
                            ? (c.levels[fk]>=4?'#3fb950':c.levels[fk]>=3?'#79c0ff':'#ffa657')
                            : '#2d333b'}"></span>
                </div>
                <span style="font-size:9px;font-weight:700" :class="espFacClass(c.levels?.[fk])">{{c.levels?.[fk]||'—'}}</span>
              </div>
            </div>

            <!-- Staff ratings -->
            <div style="display:flex;gap:10px;flex-wrap:wrap;font-size:11px">
              <span v-for="[role, label] in [['CEO','CEO'],['Technical Director','TD'],['Assistant','Asst'],['Physio','Phy']]" :key="role">
                <span style="color:#6e7681">{{label}} </span>
                <span :class="espRatingClass(c.current?.[role]?.rating)" style="font-weight:700">{{c.current?.[role]?.rating||'—'}}</span>
              </span>
              <span v-if="c.ads?.length" style="margin-left:auto;background:#2d2a0e;color:#e3b341;border-radius:6px;padding:1px 7px;font-size:10px;font-weight:700">{{c.ads.length}} ad{{c.ads.length>1?'s':''}}</span>
            </div>

          </div>
        </div>
      </div>
    </template>
      </div>
