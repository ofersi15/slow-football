  <!-- ── ASSISTANT DOCK (side panel — mirrors tab-assistant.html; kept as a separate instance since only one can be mounted at a time) ── -->
      <div v-if="assistantDockOpen && activeTab!=='assistant'" class="assistant-dock">

    <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 12px;border-bottom:1px solid #21262d;flex-shrink:0">
      <div style="font-size:13px;font-weight:700">🤖 Assistant</div>
      <div style="display:flex;align-items:center;gap:5px">
        <select v-model="activeChatSessionId" @change="switchChatSession(activeChatSessionId)"
          style="background:#0d1117;border:1px solid #30363d;color:#e6edf3;border-radius:6px;padding:4px 6px;font-size:10px;max-width:100px">
          <option v-for="s in sortedChatSessions()" :key="s.id" :value="s.id">{{s.title}}</option>
        </select>
        <button class="btn" style="font-size:10px;padding:3px 6px;min-height:auto" @click="newChatSession" title="New chat">+</button>
        <button class="btn" style="font-size:10px;padding:3px 6px;min-height:auto" @click="deleteChatSession(activeChatSessionId)" title="Delete chat">🗑</button>
        <button class="btn" style="font-size:10px;padding:3px 6px;min-height:auto" @click="closeAssistantDock" title="Close panel">✕</button>
      </div>
    </div>

    <!-- Message list -->
    <div ref="chatScroll" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:12px">
      <div v-if="!chatMessages.length" class="c-gray" style="text-align:center;padding:24px 10px;font-style:italic;font-size:12px">
        No messages yet. Try: "Who should I target at CB under £15m?"
      </div>
      <div v-for="(m,i) in chatMessages" :key="i"
        :style="{alignSelf: m.role==='user' ? 'flex-end' : 'flex-start', maxWidth:'92%'}">
        <div :style="{
          background: m.role==='user' ? '#1f6feb' : '#0d1117',
          border: m.role==='user' ? 'none' : '1px solid #21262d',
          color: m.role==='user' ? '#fff' : '#e6edf3',
          borderRadius:'10px', padding:'8px 12px', fontSize:'13px', lineHeight:'1.5'}">
          <template v-for="(b,bi) in chatBlocks(m.content)" :key="bi">
            <div v-if="b.type==='text' && b.text" style="white-space:pre-wrap">{{b.text}}</div>
            <img v-else-if="b.type==='image'" :src="'data:'+b.source.media_type+';base64,'+b.source.data"
              style="max-width:180px;max-height:180px;border-radius:8px;display:block;margin-top:6px;object-fit:cover" />
            <div v-else-if="b.type==='document'" class="c-gray" style="font-size:11px;margin-top:6px">📄 PDF attached</div>
          </template>
        </div>
      </div>
      <div v-if="chatLoading" class="c-gray" style="align-self:flex-start;font-size:12px;font-style:italic;padding:4px 12px">🤖 thinking…</div>
    </div>

    <div v-if="chatError" style="color:#ff7b72;font-size:12px;padding:0 12px">⚠ {{chatError}}</div>

    <!-- Pending attachments -->
    <div v-if="chatAttachments.length" style="display:flex;gap:6px;flex-wrap:wrap;padding:0 12px">
      <div v-for="(a,ai) in chatAttachments" :key="a.id"
        style="display:flex;align-items:center;gap:4px;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:4px 6px;font-size:11px">
        <img v-if="a.kind==='image'" :src="'data:'+a.mediaType+';base64,'+a.base64" style="width:24px;height:24px;object-fit:cover;border-radius:3px" />
        <span v-else>{{a.kind==='document' ? '📄' : '📝'}}</span>
        <span class="c-gray" style="max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{a.name}}</span>
        <span style="cursor:pointer;color:#ff7b72" @click="removeChatAttachment(ai)">✕</span>
      </div>
    </div>

    <!-- Input -->
    <div style="display:flex;gap:6px;align-items:flex-end;padding:10px 12px">
      <input type="file" ref="chatFileInputDock" multiple accept="image/*,.pdf,.json,.csv,.txt,.md" style="display:none" @change="onChatFileSelected" />
      <button class="btn" style="padding:8px 9px" :disabled="chatLoading || attachmentsFull()" @click="$refs.chatFileInputDock.click()" title="Attach image, PDF or file">📎</button>
      <textarea v-model="chatInput" @keydown="onChatKeydown" placeholder="Ask your assistant…"
        :disabled="chatLoading" rows="2"
        style="flex:1;background:#0d1117;border:1px solid #30363d;color:#e6edf3;border-radius:6px;padding:8px 10px;font-size:13px;outline:none;resize:vertical;font-family:inherit"></textarea>
      <button class="btn green" style="padding:8px 12px" :disabled="chatLoading || (!chatInput.trim() && !chatAttachments.length)" @click="sendChatMessage">
        {{chatLoading ? '…' : 'Send'}}
      </button>
    </div>

      </div>
