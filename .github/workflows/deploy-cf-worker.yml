name: Deploy CF Worker

on:
  push:
    branches: [main]
    paths:
      - 'cf-worker/index.js'
      - 'cf-worker/wrangler.toml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          workingDirectory: cf-worker
          command: deploy index.js --name sf-cache
